<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearDeeBee | Home</title>
    <style>
        /* --- 1. ARKA PLAN AYARLARI --- */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: url('Background.jpg'); /* Arka plan resmin */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* --- 2. ANA TAŞIYICI (Pencere) --- */
        .app-container {
            width: 90%;
            max-width: 1000px;
            margin-top: 20px;
        }

        /* --- 3. SEKME ÇUBUĞU --- */
        .tab-header {
            display: flex;
            align-items: flex-end; /* Sekmeleri alt çizgiye hizala */
            gap: 5px; /* Sekmeler arası boşluk */
        }

        /* En Soldaki Logo Yazısı */
        .logo-text {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: bold;
            margin-right: 30px;
            padding-bottom: 12px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        /* Normal (Pasif) Sekmeler */
        .tab {
            padding: 12px 25px;
            background-color: rgba(0, 0, 0, 0.6); /* Koyu şeffaf */
            color: #ffffff;
            font-weight: bold;
            border-radius: 10px 10px 0 0; /* Sadece üst köşeler yuvarlak */
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .tab:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        /* Aktif Olan (Beyaz) Sekme */
        .tab.active {
            background-color: #ffffff; /* Ana kutuyla aynı renk */
            color: #000000;
        }

        /* --- 4. ANA İÇERİK KUTUSU (Beyaz Alan) --- */
        .main-content {
            background-color: #ffffff; /* Bembeyaz arka plan */
            border-radius: 0 10px 10px 10px; /* Sağ ve alt köşeler yuvarlak */
            padding: 40px;
            min-height: 400px; /* Kutunun belli bir boyu olsun */
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5); /* Gölgelendirme */
        }

        /* Sayfaları Gizleme Sınıfı */
        .page {
            display: none; /* Sayfalar başta gizli */
        }

        /* Sadece Aktif Sayfa Görünür */
        .page.active {
            display: block; /* Animasyon veya ekstra kod hatası vermez */
        }

        /* --- 5. İÇERİK YAZI STİLLERİ --- */
        h2 {
            margin-top: 0;
            color: #1a1a1a;
            border-bottom: 2px solid #eeeeee;
            padding-bottom: 10px;
        }
        p {
            color: #333333;
            line-height: 1.6;
            font-size: 1.1rem;
        }
        a {
            color: #0056b3;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="tab-header">
            <div class="logo-text">LearDeeBee</div>
            <div class="tab active" onclick="openTab(event, 'home')">Home</div>
            <div class="tab" onclick="openTab(event, 'projects')">Projects</div>
            <div class="tab" onclick="openTab(event, 'download')">Download</div>
        </div>

        <div class="main-content">
            
            <div id="home" class="page active">
                <h2>Welcome!</h2>
                <p>Welcome to my site, I share my projects, releases and more.</p>
            </div>

            <div id="projects" class="page">
                <h2>Projects I have developed</h2>
                <p><strong>Gemini4Life:</strong> A project for using Gemini for free.</p>
                <p>More projects comes soon!</p>
            </div>

            <div id="download" class="page">
                <h2>Download</h2>
                <p>You can download my projects from here</p>
                <p><a href="https://github.com/LearDeeBee" target="_blank">Go to my github profile</a></p>
            </div>

        </div>
    </div>

    <script>
        function openTab(evt, tabName) {
            // 1. Tüm sayfaları bul ve gizle
            let pages = document.querySelectorAll('.page');
            for (let i = 0; i < pages.length; i++) {
                pages[i].style.display = "none";
                pages[i].classList.remove("active");
            }

            // 2. Tüm sekmelerin "active" sınıfını (beyaz rengini) kaldır
            let tabs = document.querySelectorAll('.tab');
            for (let i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove("active");
            }

            // 3. Tıklanan sekmeyi beyaz yap ve ilgili sayfayı göster
            document.getElementById(tabName).style.display = "block";
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>

</body>
</html>
